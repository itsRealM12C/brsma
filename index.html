<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BR02 Extractor</title>
<style>
:root{
  --bg:#0b0c0f; --panel:#15171b; --panel-2:#101216;
  --border:#292c33; --border-2:#30343b;
  --text:#f4f4f5; --muted:#858993; --muted-2:#9296a0;
  --accent:#f1f1f2; --ok:#b8e6bd; --warn:#e5cf9a;
}
:root:not([data-theme="light"]){ }
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f2f2f4; --panel:#fff; --panel-2:#f5f5f7; --border:#e2e2e6;
    --border-2:#d5d5db; --text:#111214; --muted:#6b6f78; --muted-2:#54575f;
    --accent:#18181b;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:rgba(255,255,255,0)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior-y:none}
button,input,label{-webkit-tap-highlight-color:rgba(255,255,255,0);font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}

.app{height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);flex:0 0 auto}
.brand{min-width:0}
h1{margin:0;font-size:16px;line-height:1.2;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{margin-top:1px;color:var(--muted);font-size:11px}
.head-btn{width:34px;height:34px;border-radius:9px;background:var(--panel-2);display:grid;place-items:center;flex:0 0 auto}
.head-btn svg{width:17px;height:17px;fill:currentColor}
.head-btn:hover{background:var(--border)}

main{flex:1 1 auto;min-height:0;overflow-y:auto;padding:10px 14px 14px;display:flex;flex-direction:column;gap:10px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:12px}

.drop{min-height:76px;border:1.5px dashed var(--border-2);border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;transition:background .15s,border-color .15s;user-select:none}
.drop:hover,.drop.drag{background:var(--panel-2);border-color:var(--muted-2)}
.drop input{display:none}
.drop b{font-size:13px}
.drop .sub{margin-top:2px}

.stage{
  display:flex; justify-content:center; align-items:center;
  background:var(--panel-2); border-radius:10px; padding:10px;
}
#canvas{
  display:block;
  width:auto; height:auto;
  max-width:220px; max-height:180px;
  image-rendering:pixelated;
  background:#fff; border-radius:4px;
  box-shadow:0 1px 0 var(--border);
}
.stage-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:11px;color:var(--muted)}

.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px}
.stat{background:var(--panel-2);border-radius:9px;padding:7px 9px;min-width:0}
.stat b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.stat span{display:block;margin-top:1px;color:var(--muted);font-size:10.5px}

.media-bottom{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.media-btn{
  width:36px;height:36px;border-radius:10px;background:var(--panel-2);
  display:grid;place-items:center;transition:background .12s,transform .08s;
}
.media-btn:hover{background:var(--border)}
.media-btn:active{transform:scale(.94)}
.media-btn svg{width:17px;height:17px;fill:currentColor}
.media-btn:disabled{opacity:.35;cursor:not-allowed}
.spacer{flex:1}
.frame-info{color:var(--muted-2);font:11px ui-monospace,SFMono-Regular,Consolas,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

details.log-details summary{cursor:pointer;font-size:12px;color:var(--muted);user-select:none}
.log{font:11px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;color:var(--muted);max-height:220px;overflow:auto;margin-top:8px}
.ok{color:var(--ok)}
.warn{color:var(--warn)}

.app:fullscreen,.app:-webkit-full-screen{background:var(--bg)}
</style>
</head>
<body>
<div class="app" id="app">
<header>
  <div class="brand">
    <h1>BR02 Extractor</h1>
    <div class="sub">JieLi BR02 · row RLE · ARGB8565 → PNG/GIF</div>
  </div>
  <button class="head-btn" id="fullscreenBtn" title="Toggle fullscreen" aria-label="Toggle fullscreen">
    <svg id="fsIcon" viewBox="0 0 24 24"><path d="M4 9V4h5v2H6v3H4zm10-5h5v5h-2V6h-3V4zM4 15h2v3h3v2H4v-5zm14 3v-3h2v5h-5v-2h3z"/></svg>
  </button>
</header>

<main>
  <div class="panel">
    <label class="drop" id="drop">
      <input id="file" type="file" accept=".bin,application/octet-stream">
      <div>
        <b>Choose a BR02 resource</b><br>
        <span class="sub">or drop your .bin file here</span>
      </div>
    </label>
  </div>

  <div class="panel" id="infoPanel" hidden>
    <div class="info">
      <b id="_spacer" hidden></b>
      <div class="stat"><b id="imgSize">—</b><span>Dimensions</span></div>
      <div class="stat"><b id="imgBytes">—</b><span>Decompressed bytes</span></div>
      <div class="stat"><b id="imgFormat">—</b><span>Pixel format</span></div>
      <div class="stat"><b id="fileBytes">—</b><span>File size</span></div>
    </div>
  </div>

  <div class="panel">
    <div class="stage"><canvas id="canvas" width="296" height="240"></canvas></div>
    <div class="stage-foot">
      <span id="previewNote">Preview shown at fixed size — use Save for full resolution.</span>
    </div>
  </div>

  <div class="panel">
    <div class="media-bottom">
      <div class="spacer"></div>
      <div class="frame-info" id="frameLabel">No file loaded</div>
      <button class="media-btn" id="gif" title="Save as GIF" aria-label="Save as GIF" disabled>
        <svg viewBox="0 0 24 24"><path d="M3 5h18v14H3V5zm2 2v2h2V7H5zm0 4v2h2v-2H5zm0 4v2h2v-2H5zm12-8v2h2V7h-2zm0 4v2h2v-2h-2zm0 4v2h2v-2h-2zM9 7h6v10H9V7z"/></svg>
      </button>
      <button class="media-btn" id="png" title="Save as PNG" aria-label="Save as PNG" disabled>
        <svg viewBox="0 0 24 24"><path d="M12 3v11m0 0 4-4m-4 4-4-4M5 17v2h14v-2"/></svg>
      </button>
    </div>
  </div>

  <div class="panel">
    <details class="log-details" open>
      <summary>Log</summary>
      <div class="log" id="log"></div>
    </details>
  </div>
</main>
</div>

<script>
"use strict";

const $ = id => document.getElementById(id);
const fileInput = $("file");
const drop = $("drop");
const pngBtn = $("png");
const gifBtn = $("gif");
const frameLabel = $("frameLabel");

const canvas = $("canvas");
const ctx = canvas.getContext("2d");

let selected = null;
let decoded = null;

function log(text,cls=""){
  const el = document.createElement("div");
  el.textContent = text;
  if(cls) el.className = cls;
  $("log").appendChild(el);
  el.scrollIntoView({block:"nearest"});
}

function clearLog(){
  $("log").textContent = "";
}

function u16(d,o){return d.getUint16(o,true)}
function u32(d,o){return d.getUint32(o,true)}

function decodeRow(src,width){
  const out = new Uint8Array(width*3);
  let sp=0, op=0;

  while(sp<src.length && op<out.length){
    const c=src[sp++];
    const count=c&0x7f;
    if(!count) continue;

    if(c&0x80){
      if(sp+3>src.length) throw new Error("Truncated repeat pixel");
      const a=src[sp++], b=src[sp++], q=src[sp++];
      for(let i=0;i<count;i++){
        if(op+3>out.length) throw new Error("Row overflow");
        out[op++]=a; out[op++]=b; out[op++]=q;
      }
    }else{
      const n=count*3;
      if(sp+n>src.length) throw new Error("Truncated literal pixels");
      out.set(src.subarray(sp,sp+n),op);
      sp+=n; op+=n;
    }
  }

  if(op!==out.length)
    throw new Error(`Row decoded to ${op} bytes; expected ${out.length}`);
  return out;
}

function decode(blob){
  const d=new DataView(blob);
  if(blob.byteLength<4 || new Uint8Array(blob,0,4)[0]!==0x42 ||
     new Uint8Array(blob,0,4)[1]!==0x52 ||
     new Uint8Array(blob,0,4)[2]!==0x02 ||
     new Uint8Array(blob,0,4)[3]!==0x00)
    throw new Error("Not a BR02 file (expected 42 52 02 00)");

  const width=u16(d,0xd0);
  const height=u16(d,0xd2);
  if(!width || !height) throw new Error("Invalid dimensions");
  log(`Header OK · magic BR\\x02\\x00 · ${width}×${height}`);

  const table=0xd8;
  const bytes=new Uint8Array(blob);
  const raw=new Uint8Array(width*height*3);

  for(let y=0;y<height;y++){
    const packed=u32(d,table+y*4);
    const rowOff=packed&0x1fffff;
    const rowLen=packed>>>21;
    const start=table+rowOff;
    const end=start+rowLen;
    if(end>bytes.length) throw new Error(`Row ${y} exceeds file`);

    const row=decodeRow(bytes.subarray(start,end),width);
    raw.set(row,y*width*3);

    if(y===0 || y===height-1 || (y+1)%64===0){
      log(`Row ${y+1}/${height}: off=${rowOff}, len=${rowLen} → ${row.length} bytes`);
    }
  }

  log(`All ${height} rows decoded · ${raw.length.toLocaleString()} ARGB8565 bytes`,"ok");

  const rgb=new Uint8Array(width*height*3);
  for(let p=0,i=0;p<raw.length;p+=3,i+=3){
    const word=(raw[p+1]<<8)|raw[p+2];
    const r=(word>>11)&31;
    const g=(word>>5)&63;
    const b=word&31;

    rgb[i]=(r<<3)|(r>>2);
    rgb[i+1]=(g<<2)|(g>>4);
    rgb[i+2]=(b<<3)|(b>>2);
  }

  return {width,height,raw,rgb};
}

function drawToCanvas(d){
  canvas.width = d.width;
  canvas.height = d.height;
  const rgba = new Uint8ClampedArray(d.width * d.height * 4);
  for(let i=0,j=0; i<d.rgb.length; i+=3,j+=4){
    rgba[j]=d.rgb[i];
    rgba[j+1]=d.rgb[i+1];
    rgba[j+2]=d.rgb[i+2];
    rgba[j+3]=255;
  }
  ctx.putImageData(new ImageData(rgba, d.width, d.height), 0, 0);
}

function download(blob,name){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=name;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

/* ---------------- Color quantization (median cut) ---------------- */

function quantizeMedianCut(rgb,width,height){
  const n=width*height;

  const hist=new Map();
  for(let i=0;i<rgb.length;i+=3){
    const key=(rgb[i]<<16)|(rgb[i+1]<<8)|rgb[i+2];
    hist.set(key,(hist.get(key)||0)+1);
  }
  log(`Unique colors: ${hist.size}`);

  let colors=[];
  for(const [key,count] of hist){
    colors.push([(key>>16)&0xFF,(key>>8)&0xFF,key&0xFF,count]);
  }

  let buckets=[colors];

  while(buckets.length<256){
    let maxRange=-1, maxIdx=-1, maxCh=0;

    for(let bi=0;bi<buckets.length;bi++){
      const b=buckets[bi];
      if(b.length<2) continue;

      for(let c=0;c<3;c++){
        let mn=255,mx=0;
        for(let j=0;j<b.length;j++){
          if(b[j][c]<mn) mn=b[j][c];
          if(b[j][c]>mx) mx=b[j][c];
        }
        const range=mx-mn;
        if(range>maxRange){
          maxRange=range; maxIdx=bi; maxCh=c;
        }
      }
    }

    if(maxIdx===-1) break;

    const bucket=buckets[maxIdx];
    bucket.sort((a,b)=>a[maxCh]-b[maxCh]);

    let totalW=0;
    for(let j=0;j<bucket.length;j++) totalW+=bucket[j][3];
    let halfW=totalW/2, cumW=0, split=0;
    for(let j=0;j<bucket.length;j++){
      cumW+=bucket[j][3];
      if(cumW>=halfW){split=j+1;break;}
    }
    if(split<1) split=1;
    if(split>=bucket.length) split=bucket.length-1;

    buckets.splice(maxIdx,1,bucket.slice(0,split),bucket.slice(split));
  }

  const palette=[];
  for(const bucket of buckets){
    if(!bucket.length) continue;
    let r=0,g=0,b=0,total=0;
    for(let j=0;j<bucket.length;j++){
      r+=bucket[j][0]*bucket[j][3];
      g+=bucket[j][1]*bucket[j][3];
      b+=bucket[j][2]*bucket[j][3];
      total+=bucket[j][3];
    }
    palette.push([Math.round(r/total),Math.round(g/total),Math.round(b/total)]);
  }

  log(`Palette: ${palette.length} colors`);

  const paletteBytes=new Uint8Array(768);
  for(let i=0;i<palette.length && i<256;i++){
    paletteBytes[i*3]=palette[i][0];
    paletteBytes[i*3+1]=palette[i][1];
    paletteBytes[i*3+2]=palette[i][2];
  }

  const indexed=new Uint8Array(n);
  const cache=new Map();
  const k=palette.length;

  for(let i=0;i<n;i++){
    const r=rgb[i*3], g=rgb[i*3+1], b=rgb[i*3+2];
    const key=(r<<16)|(g<<8)|b;

    let idx=cache.get(key);
    if(idx===undefined){
      let minDist=Infinity;
      idx=0;
      for(let j=0;j<k;j++){
        const dr=r-palette[j][0];
        const dg=g-palette[j][1];
        const db=b-palette[j][2];
        const dist=dr*dr+dg*dg+db*db;
        if(dist<minDist){minDist=dist;idx=j;}
      }
      cache.set(key,idx);
    }
    indexed[i]=idx;
  }

  return {indexed,palette:paletteBytes,numColors:palette.length};
}

/* ---------------- GIF encoder (single frame) ---------------- */

function lzwEncode(pixels,minCodeSize){
  const clearCode=1<<minCodeSize;
  const endCode=clearCode+1;
  let codeSize=minCodeSize+1;
  let nextCode=endCode+1;

  const dict=new Map();
  for(let i=0;i<clearCode;i++){
    dict.set(String.fromCharCode(i),i);
  }

  const out=[];
  let bitBuf=0,bitCnt=0;

  function emit(code){
    bitBuf|=(code<<bitCnt);
    bitCnt+=codeSize;
    while(bitCnt>=8){
      out.push(bitBuf&0xFF);
      bitBuf>>>=8;
      bitCnt-=8;
    }
  }

  function resetDict(){
    dict.clear();
    for(let i=0;i<clearCode;i++){
      dict.set(String.fromCharCode(i),i);
    }
    codeSize=minCodeSize+1;
    nextCode=endCode+1;
  }

  emit(clearCode);
  let w=String.fromCharCode(pixels[0]);

  for(let i=1;i<pixels.length;i++){
    const c=pixels[i];
    const wc=w+String.fromCharCode(c);
    if(dict.has(wc)){
      w=wc;
    }else{
      emit(dict.get(w));
      dict.set(wc,nextCode);
      nextCode++;
      if(nextCode===(1<<codeSize)&&codeSize<12){
        codeSize++;
      }else if(nextCode===4095){
        emit(clearCode);
        resetDict();
      }
      w=String.fromCharCode(c);
    }
  }

  emit(dict.get(w));
  emit(endCode);

  if(bitCnt>0){
    out.push(bitBuf&0xFF);
  }

  return out;
}

function encodeGIFSingle(width,height,indexed,palette){
  const out=[];

  out.push(0x47,0x49,0x46,0x38,0x39,0x61);

  out.push(width&0xFF,(width>>8)&0xFF);
  out.push(height&0xFF,(height>>8)&0xFF);
  out.push(0xF7,0x00,0x00);

  for(let i=0;i<256;i++){
    out.push(palette[i*3],palette[i*3+1],palette[i*3+2]);
  }

  out.push(0x2C);
  out.push(0x00,0x00,0x00,0x00);
  out.push(width&0xFF,(width>>8)&0xFF);
  out.push(height&0xFF,(height>>8)&0xFF);
  out.push(0x00);

  const minCodeSize=8;
  out.push(minCodeSize);

  const lzw=lzwEncode(indexed,minCodeSize);
  let pos=0;
  while(pos<lzw.length){
    const chunk=Math.min(255,lzw.length-pos);
    out.push(chunk);
    for(let i=0;i<chunk;i++){
      out.push(lzw[pos+i]);
    }
    pos+=chunk;
  }
  out.push(0x00);

  out.push(0x3B);

  return new Uint8Array(out);
}

/* ---------------- Main processing ---------------- */

async function process(){
  if(!selected)return;
  clearLog();
  try{
    log(`Selected: ${selected.name} (${selected.size.toLocaleString()} bytes)`);
    log("Decoding…");

    decoded=decode(await selected.arrayBuffer());

    $("imgSize").textContent = `${decoded.width} × ${decoded.height}`;
    $("imgBytes").textContent = decoded.raw.length.toLocaleString();
    $("imgFormat").textContent = "ARGB8565";
    $("fileBytes").textContent = `${(selected.size/1024).toFixed(1)} KB`;
    $("infoPanel").hidden = false;

    frameLabel.textContent = `${decoded.width}×${decoded.height} · ARGB8565`;

    drawToCanvas(decoded);

    pngBtn.disabled=false;
    gifBtn.disabled=false;

    pngBtn.onclick = () => {
      canvas.toBlob(blob => {
        if(!blob) return;
        download(blob, selected.name.replace(/\.[^.]+$/, "") + ".png");
      }, "image/png");
    };

    gifBtn.onclick = () => {
      if(!decoded) return;
      if(gifBtn.disabled) return;
      gifBtn.disabled = true;
      log("Quantizing to 256 colors…");
      setTimeout(() => {
        try{
          const {indexed,palette} = quantizeMedianCut(decoded.rgb, decoded.width, decoded.height);
          log("Encoding GIF…");
          const bytes = encodeGIFSingle(decoded.width, decoded.height, indexed, palette);
          download(new Blob([bytes], {type:"image/gif"}),
            selected.name.replace(/\.[^.]+$/, "") + ".gif");
          log(`GIF saved (${(bytes.length/1024).toFixed(1)} KB)`, "ok");
        }catch(e){
          log("GIF encode failed: " + e.message, "warn");
        }finally{
          gifBtn.disabled = false;
        }
      }, 10);
    };

    log("Decoded successfully.", "ok");
  }catch(e){
    decoded = null;
    pngBtn.disabled = true;
    gifBtn.disabled = true;
    $("infoPanel").hidden = true;
    frameLabel.textContent = "No file loaded";
    log("Decode failed: " + e.message, "warn");
  }
}

fileInput.onchange = () => {
  selected = fileInput.files[0] || null;
  if(selected) process();
};

drop.onclick = () => { fileInput.click(); };

["dragenter","dragover"].forEach(ev => drop.addEventListener(ev, e => {
  e.preventDefault(); drop.classList.add("drag");
}));
["dragleave","drop"].forEach(ev => drop.addEventListener(ev, e => {
  e.preventDefault(); drop.classList.remove("drag");
}));
drop.addEventListener("drop", e => {
  const f = e.dataTransfer.files[0];
  if(f){
    selected = f;
    process();
  }
});

/* Fullscreen toggle */
const appEl = $("app");
const fsBtn = $("fullscreenBtn");
const fsIcon = $("fsIcon");
const ICON_ENTER = '<path d="M4 9V4h5v2H6v3H4zm10-5h5v5h-2V6h-3V4zM4 15h2v3h3v2H4v-5zm14 3v-3h2v5h-5v-2h3z"/>';
const ICON_EXIT  = '<path d="M9 4v3H6v2H4V4h5zm11 5V6h-3V4h5v5h-2zM4 15h2v3h3v2H4v-5zm16 0v5h-5v-2h3v-3h2z"/>';

function updateFsIcon(){
  const isFs = document.fullscreenElement || document.webkitFullscreenElement;
  fsIcon.innerHTML = isFs ? ICON_EXIT : ICON_ENTER;
  fsBtn.title = isFs ? "Exit fullscreen" : "Enter fullscreen";
}

fsBtn.onclick = () => {
  const isFs = document.fullscreenElement || document.webkitFullscreenElement;
  if(!isFs){
    (appEl.requestFullscreen || appEl.webkitRequestFullscreen)?.call(appEl);
  }else{
    (document.exitFullscreen || document.webkitExitFullscreen)?.call(document);
  }
};

document.addEventListener("fullscreenchange", updateFsIcon);
document.addEventListener("webkitfullscreenchange", updateFsIcon);
updateFsIcon();
</script>
</body>
</html>
